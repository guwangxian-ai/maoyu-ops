# Include inside the existing 443 server for 43.136.91.22.
# Existing /hermes, /douyin-leads and /weixin-bot-notification-platform locations stay unchanged.
location = /xianyu-auto-reply {
    return 308 /xianyu-auto-reply/;
}

# Project-scoped public instructions and Streamable HTTP. Keep other projects' routes untouched.
location = /xianyu-auto-reply/ai {
    proxy_pass http://127.0.0.1:18089/ai;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /xianyu-auto-reply/ai/ {
    proxy_pass http://127.0.0.1:18089/ai/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /xianyu-auto-reply/mcp {
    client_max_body_size 4m;
    proxy_pass http://127.0.0.1:18089/mcp;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1900s;
}

# Portable clients derive upload and management paths from the MCP project base.
location ^~ /xianyu-auto-reply/api/v1/ {
    client_max_body_size 257m;
    proxy_pass http://127.0.0.1:18089/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1900s;
}

location ^~ /xianyu-auto-reply/ {
    root /srv/xianyu-auto-reply/site;
    try_files $uri $uri/ /xianyu-auto-reply/index.html;
}

# The current frontend uses absolute /api/v1 and /static URLs.
# These exact root prefixes currently return 404 on the IP virtual host.
location ^~ /api/v1/ {
    client_max_body_size 50m;
    proxy_pass http://127.0.0.1:18089;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
}

location ^~ /static/ {
    proxy_pass http://127.0.0.1:18089;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
